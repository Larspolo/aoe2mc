name: aoe2mc
version: '1'
main: aoe2mc.AoePlugin
api-version: '26.3'
description: Orders of the aoe2mc game program with Minecraft path finding (#435).
commands:
  aoe:
    description: Orders for units.
    usage: /aoe moveto <selector> <x> <y> <z> [speed] | /aoe attack <selector> <target selector> | /aoe goals <selector> | /aoe menu <player> <title> <slot>:<material>:<name>:<lore> ... | /aoe menu-close <player> | /aoe stop <selector> | /aoe sight <selector> <blocks>
    permission: aoe2mc.order
  aoego:
    description: Go to the place of an attack alert of your team (a click on the alert line, #1816).
    usage: /aoego <x> <z>
  controls:
    description: Show the controls of the game in the chat (#5501, the trigger aoe_controls).
    usage: /controls
permissions:
  aoe2mc.order:
    default: op
