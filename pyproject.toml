[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not slow and not mc'"
markers = ["slow: long tests (full gallery conversion); run with: pytest -m slow",
           "mc: load a world in a real Minecraft server (downloads 50 MB); run with: pytest -m mc"]
filterwarnings = ["ignore::DeprecationWarning:AoE2ScenarioParser.*"]

[tool.ruff]
line-length = 130
extend-exclude = ["tools/mcdata"]

[tool.ruff.lint]
select = ["F"]        # pyflakes: undefined names, unused variables and imports
