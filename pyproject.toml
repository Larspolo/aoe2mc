[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "aoe2mc"
version = "0.1.0"
description = "Convert an Age of Empires II: DE scenario to a Minecraft Java world"
readme = "README.md"
license = {text = "GPL-3.0"}
requires-python = ">=3.10"
dependencies = [          # the same as requirements.txt
    "AoE2ScenarioParser>=0.9.8,<0.10",
    "nbtlib>=2.0.4,<3",
    "numpy>=1.26",
    "pillow>=10",
    "mgz>=1.8.51,<2",
]

[project.scripts]
aoe2mc = "aoe2mc_app.aoe2mc:main"

[project.gui-scripts]
aoe2mc-gui = "aoe2mc_app.gui:run"            # the converter window (#1540)

[tool.setuptools]
package-dir = {"aoe2mc_app" = "."}   # one top-level name, not units, gui ... (#3056)
packages = ["aoe2mc_app", "aoe2mc_app.data", "aoe2mc_app.tools.mcdata"]   # 26.3.json and data/*.jsonl (#1917)

[tool.setuptools.package-data]
"aoe2mc_app.tools.mcdata" = ["26.3.json"]
"aoe2mc_app.data" = ["*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not slow and not mc'"
markers = ["slow: long tests (full gallery conversion); run with: pytest -m slow",
           "mc: load a world in a real Minecraft server (downloads 50 MB); run with: pytest -m mc"]
filterwarnings = ["ignore::DeprecationWarning:AoE2ScenarioParser.*"]

[tool.ruff]
line-length = 130
extend-exclude = ["tools/mcdata"]

[tool.ruff.lint]
select = ["F"]        # pyflakes: undefined names, unused variables and imports
