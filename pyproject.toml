[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not slow'"
markers = ["slow: long tests (full gallery conversion); run with: pytest -m slow"]
filterwarnings = ["ignore::DeprecationWarning:AoE2ScenarioParser.*"]

[tool.ruff]
line-length = 130
extend-exclude = ["tools/mcdata"]

[tool.ruff.lint]
select = ["F"]        # pyflakes: undefined names, unused variables and imports

[tool.ruff.lint.per-file-ignores]
# Baseline: errors that were in the code before the lint check. Remove these lines when you fix them.
"aoe2mc.py" = ["F402", "F841"]
"buildings.py" = ["F541", "F841"]
