# Project values of the agent system (#905). The tools in tools/ read this file (tools/agent_config.py), and the
# skills name it in place of the values. For another repository, change this file. The workflows take the repository
# from GitHub ($GITHUB_REPOSITORY). The permission rules in .claude/settings.json cannot read a file: change them too.

repo = "Larspolo/aoe2mc"        # owner/name on GitHub
owner = "Larspolo"              # the GitHub login that gives instructions
branch = "main"                 # the default branch

[status]
issue = 1                       # the status issue: the dashboard and the state comment of the runs
label = "agent-status"
paused = "paused"               # this label on the status issue stops all runs

[pacing]
max_runs = 40                   # the most runs at one time (tools/usage.py): 16 used only about 70 % of a 5-hour window at burn 0.009
max_fire = 8                    # the most runs that the pacer starts in one 10-minute cycle (tools/usage.py)
refill_runs = 3                # runs beyond the ready tickets: each refills one epic (tools/usage.py); 1 left 3 ready for 40 runs
week_free = 0.60                # below this 7-day usage the runs fill each 5-hour window, no weekly pace (tools/usage.py)
week_guard = false              # true: the 7-day usage limits the runs (week_free, #1695); false: only the 5-hour window counts (owner, 2026-10-28)
max_waiting_prs = 10            # flow brake: at this many agent PRs older than pr_minutes the pacer starts 1 repair run (tools/usage.py)
max_ci_queue = 5                # flow brake: at this many queued CI runs the pacer starts no run
pr_minutes = 30                 # an agent PR older than this waits for a fix, a conflict merge or CI, not for the quota
weights = { haiku = 0.25, deep = 4.0 }   # a lane run in Opus runs: the start value until the Usage: lines measure it (#1727); deep: high effort, at least 4.5 times the tokens of a low-effort run (2026-10-28)
reserved = ["haiku", "deep"]    # lanes whose tickets Opus runs never take (#1994); with deep, only deep runs do the reviews and the refill (claim.py)
pacer = "workflow"              # who starts the runs: "session" (the pacer session, skill pacer) or "workflow" (pacer.yml, tools/pacer.py, #3193)
trigger = "trig_01QTrgkK5PZmqPwQ96rKp3QE"   # the scheduled task "aoe2mc autopilot": the pacer fires it (#1898)

[commands]
install = "python3 -m pip install -r requirements-dev.txt"
lint = "ruff check ."
fast = "python3 -m pytest -n auto"
slow = "python3 -m pytest -m slow"
server = "python3 -m pytest -m mc"

[owner_tasks]                   # tools/owner_tasks.py
play = "Minecraft client"       # a needs-human body with this text is a play test
replay = '\.aoe2record\b'        # a regex: a ticket with a match goes into the group "replay" of --plan

[lint]                          # tools/health.py counts the lines of this list (#1909)
data = "tests/data/game_names_in_code.txt"   # the places of domain data left in the code: only gets shorter

[docs]
system = "docs/SYSTEM.md"
steering = "docs/STEERING.md"
learnings = "docs/LEARNINGS.md"
roadmap = "docs/ROADMAP.md"

[dashboard]
artifact = "https://claude.ai/artifact/6UL256SwEuNGNgzKkxojrh"   # the owner's dashboard artifact (skill dashboard-refresh, #982)
