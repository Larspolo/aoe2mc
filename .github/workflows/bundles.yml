name: Bundles

# App bundles that run without Python (#1541, part of #1539): one folder per system with the window (aoe2mc-gui),
# the command line (aoe2mc) and the game program (aoe2mc-game with the Paper plugin jar, #1778), built with PyInstaller
# from packaging/aoe2mc.spec (docs/packaging.md). Each job
# converts a scenario and a record with the frozen command line: a missing data file gives an error only at run time.
# Each job then makes the installer of its system, installs it as a user would and converts a scenario with the
# installed command line (#1542). installers.yml attaches the installers to the release of a tag v*.
on:
  workflow_dispatch:
  workflow_call:        # the release workflow (#1542)
  pull_request:
    paths: [packaging/**, .github/workflows/bundles.yml, .github/workflows/installers.yml]

permissions:
  contents: read

jobs:
  pack:                 # the resource pack of the release (#2741): one build, so that each bundle knows its SHA-1
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      sha1: ${{ steps.pack.outputs.sha1 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packaging/requirements.txt
      - run: python -m pip install -r packaging/requirements.txt
      - id: pack
        run: |
          python packaging/release_pack.py dist/aoe2mc-resourcepack.zip
          sha1=$(sha1sum dist/aoe2mc-resourcepack.zip | cut -c1-40)
          echo "SHA-1 of the release pack: $sha1"
          echo "sha1=$sha1" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4   # installers.yml attaches the installer-* artifacts to the release
        with:
          name: installer-resourcepack
          path: dist/aoe2mc-resourcepack.zip
          if-no-files-found: error
  bundle:
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, name: windows-x86_64}
          - {os: macos-latest, name: macos-arm64}
          - {os: macos-15-intel, name: macos-x86_64}   # macos-13 is retired: the last x86_64 macOS image
          - {os: ubuntu-22.04, name: linux-x86_64}     # an old glibc: the bundle runs on more Linux systems
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packaging/requirements.txt
      - run: python -m pip install -r packaging/requirements.txt
      - uses: actions/setup-java@v4       # the JDK of the plugin build; the frozen game program runs on it too
        with:
          distribution: temurin
          java-version: "25"
      - name: Build the plugin jar
        working-directory: game/plugin
        run: |
          if [ "$RUNNER_OS" = Windows ]; then ./gradlew.bat --no-daemon -q jar; else ./gradlew --no-daemon -q jar; fi
          cp build/libs/aoe2mc-plugin.jar aoe2mc-plugin.jar     # packaging/aoe2mc.spec puts it into the bundle
      - name: Draw the icon
        run: python packaging/icon.py
      - name: Release file of a tag (the game program sends the release link of the resource pack, #2741)
        if: github.ref_type == 'tag'
        run: |
          printf '{"tag": "%s", "sha1": "%s"}\n' "$GITHUB_REF_NAME" "${{ needs.pack.outputs.sha1 }}" > packaging/release.json
      - name: Build
        run: python -m PyInstaller --noconfirm packaging/aoe2mc.spec
      - name: Convert a scenario and a record with the frozen command line
        run: |
          for f in test_village.aoe2scenario de-64.3.aoe2record; do
            dist/aoe2mc/aoe2mc "samples/$f" "out-$f"
            test -f "out-$f/level.dat"
            find "out-$f" -path "*/region/*.mca" | grep -q .
          done
      - name: The world pack of the frozen command line is the release pack
        run: |
          dist/aoe2mc/aoe2mc samples/test_village.aoe2scenario out-pack --resource-pack
          sha1=$(python -c "import hashlib, sys; print(hashlib.sha1(open(sys.argv[1], 'rb').read()).hexdigest())" \
            out-pack/resourcepacks/resources.zip)
          echo "SHA-1 of the world pack: $sha1"
          test "$sha1" = "${{ needs.pack.outputs.sha1 }}"
      - name: Open the frozen window
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb
          # the window stays open until the timeout (exit 124); an error at the start ends it before that
          set +e
          timeout 20 xvfb-run -a dist/aoe2mc/aoe2mc-gui 2> gui.err
          rc=$?
          cat gui.err
          test "$rc" = 124 && ! grep -q Traceback gui.err
      - name: Start the frozen game program
        if: runner.os == 'Linux'
        run: |
          python tools/scenarios.py tiny tiny.aoe2scenario > /dev/null
          dist/aoe2mc/aoe2mc tiny.aoe2scenario out-tiny
          game="$GITHUB_WORKSPACE/dist/aoe2mc/aoe2mc-game"
          cd "$RUNNER_TEMP"                  # no source checkout next to it: the jar and the data of the bundle
          "$game" "$GITHUB_WORKSPACE/out-tiny" --bench 10
          # a command of the plugin (typed, as in a terminal): "Stance: ..." only when the bundle loaded its jar
          printf 'aoe stance @e[limit=1]\n' | "$game" "$GITHUB_WORKSPACE/out-tiny" | tee game.out
          grep -q "Stance:" game.out
      - name: Stop the frozen game program from a program with no console (the window, #3003)
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 15
        run: |
          python tools/scenarios.py tiny tiny.aoe2scenario > $null
          dist\aoe2mc\aoe2mc.exe tiny.aoe2scenario out-tiny
          if ($LASTEXITCODE) { exit 1 }
          # pythonw has no console, as aoe2mc-gui.exe: the stop of the window must work without one
          $p = Start-Process -Wait -PassThru -FilePath pythonw -ArgumentList "packaging\stop_check.py", `
            "$PWD\dist\aoe2mc\aoe2mc-game.exe", "$PWD\out-tiny", "$PWD\stop.log"
          Get-Content stop.log
          exit $p.ExitCode
      - uses: actions/upload-artifact@v4
        with:
          name: aoe2mc-${{ matrix.name }}
          path: dist/aoe2mc
      - name: Version of the installer
        run: |
          v="${{ github.ref_type == 'tag' && github.ref_name || '0.0.0-dev' }}"
          echo "VERSION=${v#v}" >> "$GITHUB_ENV"
      - name: Windows installer (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh            # Git Bash turns the /SWITCH arguments of the installer into paths
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DVERSION=$env:VERSION" packaging\windows.iss
          if ($LASTEXITCODE) { exit 1 }
          # install it as a user would (silent, no admin), then convert with the installed command line
          $dir = "$env:RUNNER_TEMP\aoe2mc-installed"
          $p = Start-Process -Wait -PassThru -FilePath "dist\aoe2mc-$env:VERSION-windows-x64-setup.exe" `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=`"$dir`""
          if ($p.ExitCode) { exit 1 }
          & "$dir\aoe2mc.exe" samples\test_village.aoe2scenario out-installed
          if ($LASTEXITCODE -or -not (Test-Path out-installed\level.dat)) { exit 1 }
      - name: macOS installer (.dmg)
        if: runner.os == 'macOS'
        run: |
          f="dist/aoe2mc-$VERSION-${{ matrix.name }}.dmg"
          mkdir dmg && ditto dist/aoe2mc.app dmg/aoe2mc.app && ln -s /Applications dmg/Applications
          for i in 1 2 3 4 5; do        # "hdiutil: create failed - Resource busy" happens on the runners
            hdiutil create -volname aoe2mc -srcfolder dmg -ov -format UDZO "$f" && break
            test "$i" -lt 5 && sleep 10
          done
          # install it as a user would: open the image, copy the app, then convert with its command line
          hdiutil attach "$f" -mountpoint /Volumes/aoe2mc -nobrowse
          mkdir -p ~/Applications && ditto /Volumes/aoe2mc/aoe2mc.app ~/Applications/aoe2mc.app
          hdiutil detach /Volumes/aoe2mc
          ~/Applications/aoe2mc.app/Contents/MacOS/aoe2mc samples/test_village.aoe2scenario out-installed
          test -f out-installed/level.dat
      - name: Linux installer (AppImage)
        if: runner.os == 'Linux'
        run: |
          f="dist/aoe2mc-$VERSION-linux-x86_64.AppImage"
          sudo apt-get install -y desktop-file-utils    # appimagetool checks the .desktop file with it
          mkdir -p AppDir/usr/bin && cp -a dist/aoe2mc/. AppDir/usr/bin/
          cp packaging/AppRun packaging/aoe2mc.desktop AppDir/ && cp packaging/icon.png AppDir/aoe2mc.png
          curl -sSfLo appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir "$f"    # no FUSE on the runner
          # install it as a user would (extract it: no FUSE), then convert with its command line
          chmod +x "$f" && (cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/$f" --appimage-extract > /dev/null)
          "$RUNNER_TEMP/squashfs-root/AppRun" samples/test_village.aoe2scenario out-installed
          test -f out-installed/level.dat
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.name }}
          path: dist/aoe2mc-*
          if-no-files-found: error
