name: Claims

# Deletes the claim refs (claim/N, claim/N-2 ...) of a closed ticket (tools/claim.py, #211).
# The runs cannot do it: the session proxy gives 403 for branch deletes.
# It also deletes the comment locks (claim/comment-ID, #320) that are older than one day.
on:
  schedule:
    - cron: "53 5 * * *"     # once a day: the refs of all closed tickets (Actions minutes, see ci.yml)
  workflow_dispatch:

permissions:
  contents: write    # delete refs

jobs:
  delete:
    if: github.event_name != 'schedule' || vars.PAUSE_SCHEDULES != 'true'   # the variable pauses the schedules (Actions minutes)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete the claim refs of closed tickets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for ref in $(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/heads/claim/" --jq '.[].ref'); do
            n=$(sed -E 's#^refs/heads/claim/([0-9]+)(-[0-9]+)?$#\1#' <<<"$ref")
            [[ "$n" =~ ^[0-9]+$ ]] || continue
            [ "$(gh api "repos/$GITHUB_REPOSITORY/issues/$n" --jq .state)" = closed ] || continue
            echo "delete $ref"
            gh api "repos/$GITHUB_REPOSITORY/git/$ref" -X DELETE   # git/refs/heads/claim/N
          done
      - name: Delete the comment locks older than one day
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          old=$(date -u -d '1 day ago' +%FT%TZ)
          gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/heads/claim/comment-" \
            --jq '.[] | "\(.ref) \(.object.sha)"' | while read -r ref sha; do
            when=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$sha" --jq .committer.date)
            if [[ "$when" < "$old" ]]; then
              echo "delete $ref ($when)"
              gh api "repos/$GITHUB_REPOSITORY/git/$ref" -X DELETE
            fi
          done
