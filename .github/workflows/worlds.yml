name: Worlds

# Converts each map in examples/ and samples/ and attaches one zip per world to a GitHub Release (#207).
# Worlds do not go into git (CLAUDE.md). A manual run updates the release "worlds"; a tag v* gets its own release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: true
        default: "worlds"
  push:
    tags: ["v*"]

permissions:
  contents: write    # make the release

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - name: Convert the maps
        run: |
          mkdir -p out
          for f in examples/*.aoe2scenario samples/*.aoe2scenario; do
            n=$(basename "$f" .aoe2scenario)
            python aoe2mc.py "$f" "out/$n" --preview
            (cd out && zip -qr "$n.zip" "$n")
          done
      - name: Attach the zips to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          notes="Converted example worlds (Minecraft Java 26.3) of commit $GITHUB_SHA. Unzip a world into the saves folder of Minecraft."
          title="Example worlds ($TAG)" pre=""
          if [[ "$TAG" == v* ]]; then   # the release of installers.yml: its title, notes and pre-release flag (#1635)
            notes="aoe2mc $TAG. Download the installer of your system; the README section \"Install\" has the steps. The zips are the converted example worlds (Minecraft Java 26.3): unzip a world into the saves folder of Minecraft."
            title="aoe2mc $TAG"
            [[ "$TAG" == *-* ]] && pre=--prerelease   # v0.1.0-rc1: a pre-release
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            # release.yml writes the notes of a v* release (the changes of its milestone): keep them
            [[ "$TAG" == v* ]] || gh release edit "$TAG" --notes "$notes"
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$title" --notes "$notes" $pre
          fi
          gh release upload "$TAG" out/*.zip --clobber
