name: Unconflict

# Merges main into an agent PR with a merge conflict when git solves the conflict alone (#280). GitHub ignores
# `merge=union` in .gitattributes, so a new line in docs/LEARNINGS.md or docs/DESIGN.md on both sides makes the PR
# "dirty" and GitHub starts no CI. A push with GITHUB_TOKEN starts no workflow: this job starts CI on the branch,
# and Automerge accepts that CI run.
# A PR whose CI failed while main was red waited for a takeover only to merge main (#3685): when main is green again,
# this job merges main into it too, and starts CI.
# Two new lines at one place of a table (`TECHS` in game/train.py) are a conflict for git too: `tools/unconflict.py`
# keeps both sides when no side changes a base line (#1864), and CI checks the result.
on:
  schedule:
    - cron: "*/20 * * * *"     # dirty PRs get no CI event, so they wait for this job
  workflow_dispatch:      # Automerge starts it after each merge and after each failed merge

permissions:
  contents: write         # push the merge commit
  pull-requests: write
  issues: write           # label and comment
  actions: write          # gh workflow run

concurrency:
  group: unconflict
  cancel-in-progress: false

jobs:
  merge-main:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5    # pip for ruff (#2631): the system Python of the runner refuses it
        with:
          python-version: "3.12"
      - name: Merge main into the conflicted agent PRs
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config merge.conflictStyle diff3     # tools/unconflict.py needs the base of each hunk
          cp tools/unconflict.py tools/merge_jsonl.py "$RUNNER_TEMP/"   # main's copy: an older PR branch does not have it
          git config merge.jsonl.driver "python3 $RUNNER_TEMP/merge_jsonl.py %O %A %B"   # game/data/*.jsonl (#2004)
          python3 -m pip install -q "$(grep '^ruff' requirements-dev.txt)"   # checks a "keep both sides" merge (#2631)
          git fetch -q origin main
          now=$(date +%s)
          # The CI runs on main, newest first, and whether main is green now: its head passed `quick`, or the newest run.
          main_runs=$(gh api "repos/$R/actions/workflows/ci.yml/runs?branch=main&status=completed&per_page=100" \
                      --jq '[.workflow_runs[] | select(.event != "schedule" and (.conclusion == "success" or .conclusion == "failure"))
                             | {c: .conclusion, t: .created_at}]' || true)
          green=$(gh api "repos/$R/commits/$(git rev-parse origin/main)/check-runs?check_name=quick" \
                  --jq '[.check_runs[].conclusion] | index("success") != null' || true)
          [ "$green" = true ] || green=$(jq '.[0].c == "success"' <<<"$main_runs")
          for n in $(gh api "repos/$R/pulls?state=open&per_page=100" --jq ".[] | select(.head.repo.full_name == \"$R\")
                     | select(.head.ref | test(\"^(agent/|claude/|ccr-)\")) | select([.labels[].name] | index(\"hold\") | not)
                     | .number"); do
            for try in 1 2 3; do                    # GitHub computes the merge state after the first request
              pr=$(gh api "repos/$R/pulls/$n")
              state=$(jq -r .mergeable_state <<<"$pr")
              [ "$state" = unknown ] || break
              sleep 5
            done
            label=$(jq '[.labels[].name] | index("conflict") != null' <<<"$pr")
            branch=$(jq -r .head.ref <<<"$pr"); sha=$(jq -r .head.sha <<<"$pr")
            how='git solved the conflict alone (`merge=union`)'
            if [ "$state" != dirty ] && [ "$label" != true ]; then
              # Red only by a red main: its last CI run failed, and the newest main run before it failed too (#3685).
              [ "$green" = true ] || continue
              gh api "repos/$R/actions/workflows/ci.yml/runs?head_sha=$sha&per_page=1" --jq '.workflow_runs[0] // empty' \
                | jq -e --argjson m "$main_runs" '. as $r | $r.conclusion == "failure"
                        and ([$m[] | select(.t < $r.created_at)][0].c == "failure")' >/dev/null || continue
              how='its CI failed while main was red, and main is green again (#3685)'
            fi
            date=$(gh api "repos/$R/commits/$sha" --jq .commit.committer.date)
            if [ $((now - $(date -d "$date" +%s))) -lt 300 ]; then  # the run that pushed it can still merge it
              echo "#$n: the head is younger than 5 minutes"; continue
            fi
            git fetch -q origin "$branch"
            git checkout -q -B "$branch" "origin/$branch"
            if ! git merge -q --no-edit origin/main; then
              if python3 "$RUNNER_TEMP/unconflict.py" && git commit -q --no-edit; then
                how='both sides only added lines, `tools/unconflict.py` kept both (#1864)'
                py=$(git diff --name-only --diff-filter=d origin/main -- '*.py')
                if [ -n "$py" ] && ! ruff check $py; then   # for example a function that both sides define (#2631)
                  git reset -q --hard "origin/$branch"
                  [ "$label" = true ] || gh api "repos/$R/issues/$n/labels" -f "labels[]=conflict" >/dev/null || true
                  echo "#$n: the merge with both sides fails ruff: the runs solve it (autopilot step 6.10)"; continue
                fi
              else
                git merge --abort
                [ "$label" = true ] || gh api "repos/$R/issues/$n/labels" -f "labels[]=conflict" >/dev/null || true   # takeover after 10 min, not 30 (claim.py)
                echo "#$n: a real conflict: the runs solve it (autopilot step 6.10)"; continue
              fi
            fi
            if [ "$(git rev-parse HEAD)" = "$sha" ]; then
              echo "#$n: main is in the branch already"; continue
            fi
            if ! git push -q origin "HEAD:$branch"; then   # for example a change of .github/workflows on main
              echo "#$n: the push failed"; continue
            fi
            echo "#$n: merged main into $branch"
            gh api "repos/$R/issues/$n/labels/conflict" -X DELETE >/dev/null 2>&1 || true
            printf 'Merged `main` into the branch: %s. CI runs again (#280).\n' "$how" > body.md
            gh api "repos/$R/issues/$n/comments" -F body=@body.md >/dev/null
            gh workflow run ci.yml --repo "$R" --ref "$branch"
          done
