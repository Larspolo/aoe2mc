name: Release

# Makes the GitHub release of a closed release epic (owner, 2026-11-01; steering/project/RELEASE.md, "Release cycle").
# A release epic has the labels `epic` and `release` and the title "Release vX.Y.Z"; the GitHub milestone "vX.Y.Z"
# holds its scope (this job makes the milestone of each open release epic). When the epic closes as completed, the
# milestone has no open issue and the last CI run of main is green, this job tags main as vX.Y.Z, closes the milestone
# and opens the next release epic and milestone (vX.Y+1.0; the epic gets `rank`: a deep run gives it its scope). A tag of GITHUB_TOKEN starts no workflow, so this job starts the workflows
# of the tag by `workflow_dispatch`: installers.yml (the installers and the release), worlds.yml (the example worlds)
# and after-release.yml (the held tickets come back with `rank`).
on:
  issues:
    types: [closed]        # the owner closes a release epic
  workflow_dispatch:       # close.yml: a close by GITHUB_TOKEN starts no workflow
  schedule:
    - cron: "41 * * * *"   # each hour: a missed event, or a red CI of main that is green now

permissions:
  contents: write          # the tag
  actions: write           # gh workflow run
  issues: write            # the comment and the next release epic

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name != 'issues' || contains(github.event.issue.labels.*.name, 'release')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Make the milestone of each open release epic
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
        run: |
          have=$(gh api --paginate "repos/$R/milestones?state=all&per_page=100" --jq '.[].title')
          for t in $(gh api --paginate "repos/$R/issues?state=open&labels=release&per_page=100" \
                       --jq '.[] | select(.pull_request | not) | .title' | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+'); do
            if ! grep -qx "$t" <<< "$have"; then
              gh api "repos/$R/milestones" -f title="$t" -f description="The scope of the release epic \"Release $t\" (steering/project/RELEASE.md, \"Release cycle\")." > /dev/null
              echo "made the milestone $t"
            fi
          done
      - name: Tag the closed release epics
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          R: ${{ github.repository }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          for i in $(gh api --paginate "repos/$R/issues?state=closed&labels=release&per_page=100" \
                       --jq '.[] | select(.pull_request | not) | select(.state_reason == "completed") | .number'); do
            tag=$(gh api "repos/$R/issues/$i" --jq .title | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -1)
            if [ -z "$tag" ]; then echo "skip #$i: no vX.Y.Z in the title"; continue; fi
            if gh api "repos/$R/git/ref/tags/$tag" > /dev/null 2>&1; then continue; fi   # released before
            ms=$(gh api --paginate "repos/$R/milestones?state=all&per_page=100" --jq ".[] | select(.title == \"$tag\") | \"\(.number) \(.open_issues)\"")
            read -r msn left <<< "$ms"
            if [ "${left:-0}" -gt 0 ]; then echo "wait #$i ($tag): $left open issues in the milestone"; continue; fi
            sha=$(gh api "repos/$R/commits/${BRANCH:-main}" --jq .sha)
            ok=$(gh api "repos/$R/actions/workflows/ci.yml/runs?head_sha=$sha&status=completed&per_page=20" \
                   --jq '[.workflow_runs[].conclusion] | any(. == "success")')
            if [ "$ok" != "true" ]; then echo "wait #$i ($tag): no green CI run of $sha yet"; continue; fi
            gh api "repos/$R/git/refs" -f ref="refs/tags/$tag" -f sha="$sha" > /dev/null
            gh workflow run installers.yml --ref "$tag"
            gh workflow run worlds.yml --ref "$tag" -f tag="$tag"
            gh workflow run after-release.yml --ref "$tag"
            if [ -n "$msn" ]; then gh api "repos/$R/milestones/$msn" -X PATCH -f state=closed > /dev/null; fi
            IFS=. read -r major minor _ <<< "${tag#v}"
            next="v$major.$((minor + 1)).0"
            body="The epic of the next release (\`steering/project/RELEASE.md\`, \"Release cycle\"). The milestone $next holds its scope. A deep run ranks the tickets that came back after $tag (label \`rank\`), puts them into the milestone $next, writes the acceptance criteria here and removes \`rank\`. When this epic closes and the milestone has no open issue, the Release workflow tags $next."
            gh api "repos/$R/milestones" -f title="$next" -f description="The scope of the release epic \"Release $next\" (steering/project/RELEASE.md, \"Release cycle\")." > /dev/null || true
            url=$(gh issue create --title "Release $next" --body "$body" --label epic --label release --label rank --label P1)
            gh api "repos/$R/issues/$i/comments" -f body="Released by the Release workflow: tag \`$tag\` on \`${sha:0:7}\`. The installers and worlds follow in the release $tag. Next release: $url" > /dev/null
            echo "released #$i as $tag; next: $url"
          done
