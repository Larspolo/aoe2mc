name: Pacer

# Starts the autopilot runs that the quota target misses (`tools/pacer.py`, #3193):
# a script keeps no old rule in memory (the old pacer session fired 4 runs for 8, #3147). Only while `pacer` in
# `[pacing]` of agent.toml is "workflow" (#3194): another value stops the loop.
# One run loops for about 5.5 hours (a cycle every 10 minutes), then starts the next run itself: GitHub fires the
# cron schedules of this repository only a few times per day (dashboard.yml "*/10" ran at 08:43 and 15:31 on
# 2026-10-28). The schedule only restarts a loop that died. A workflow_dispatch by GITHUB_TOKEN starts a new run.
on:
  schedule:
    - cron: "*/30 * * * *"   # a restart when no loop runs; the concurrency group queues it behind a live loop
  workflow_dispatch:

permissions:
  contents: write    # checkout, the claim refs (`health.lane_claims`, the claims of the briefs) and the branch metrics
  issues: write      # the ready tickets, the status issue (`usage.fire`), `in-progress` and "Started by" of the briefs
  pull-requests: read   # the flow brake (`usage.read_flow`)
  actions: write     # the queued CI runs (`usage.read_flow`) and the start of the next loop

concurrency:
  group: pacer
  cancel-in-progress: false   # one loop at a time; a new run waits for the live loop

jobs:
  pacer:
    runs-on: ubuntu-latest
    timeout-minutes: 350     # below the 360 of GitHub: the loop ends at 330 and starts the next run
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5  # pip for numpy: the system Python of the runner refuses it (#2631)
        with:
          python-version: "3.12"
      - name: Install the Claude Code CLI (the quota read, `usage.read_usage`) and numpy (`tools/health.py`)
        run: |
          npm install -g @anthropic-ai/claude-code
          python3 -m pip install -q numpy
      - name: Check out the branch metrics (the log of each cycle, `tools/metrics_log.py --push`)
        run: git fetch -q --depth 1 origin metrics && git worktree add -q --detach "$RUNNER_TEMP/metrics" FETCH_HEAD || true
      - name: Start the runs every 10 minutes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GIT_AUTHOR_NAME: github-actions[bot]          # the claim commits of the briefs (`claim.claim`)
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          # The quota read of the first account (`usage.read_usage`). All secrets: `tools/pacer.py accounts()` finds each
          # account in them (`PACER_URL_<TASK>`, and `CLAUDE_CODE_OAUTH_TOKEN_<NAME>`, `PACER_URL_<NAME>_<TASK>`
          # of another account, #4237): a new account needs only its secrets.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: |
          end=$((SECONDS + 330 * 60))
          while [ $SECONDS -lt $end ]; do
            git fetch -q --depth 1 origin main && git reset -q --hard FETCH_HEAD   # the newest code and switch
            python3 -c "import tomllib, sys; sys.exit(tomllib.load(open('agent.toml', 'rb'))['pacing'].get('pacer') != 'workflow')" \
              || { echo "pacer is not \"workflow\" in agent.toml: stop the loop"; exit 0; }
            if ! python3 tools/pacer.py --log "$RUNNER_TEMP/pacer.jsonl"; then   # a failed call (HTTP 401, 500): red now
              sleep 600                                # the next cycle waits as usual: no fast loop of red runs
              gh workflow run pacer.yml --repo "$GITHUB_REPOSITORY" --ref main
              exit 1
            fi
            gh workflow run dashboard-site.yml --repo "$GITHUB_REPOSITORY" --ref main || true   # the dashboard, fresh each cycle
            # the status issue: 6 runs an hour, not one after each merge (35 an hour, 30 to 50 API calls each, 2026-10-29)
            gh workflow run dashboard.yml --repo "$GITHUB_REPOSITORY" --ref main || true
            # the status comments and the cycle records to the branch metrics: the cron of metrics.yml fires a few times a day
            [ -d "$RUNNER_TEMP/metrics" ] && python3 tools/metrics_log.py "$RUNNER_TEMP/metrics" --pacer "$RUNNER_TEMP/pacer.jsonl" --push || true
            sleep 600
          done
          gh workflow run pacer.yml --repo "$GITHUB_REPOSITORY" --ref main   # the next loop
