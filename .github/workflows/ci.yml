name: CI

# Quick checks (lint, fast tests: about 4 minutes) on each PR and on main, so that Automerge merges a PR soon.
# A PR that changes only Markdown files runs only the doc tests (about 1 minute, `tools/ci_select.py`, #2089).
# The full suite (slow tests, Minecraft tests, package) runs each night on main, or by hand with "full" (owner
# decision, 2026-10-26). The runs do the slow and Minecraft checks that a change needs before the push (`verify`).
# A red run on main opens a P0 ticket, so that the runs fix main first.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:    # Automerge starts CI on main after its merge (#232), Unconflict on a branch (#280)
    inputs:
      full:
        description: "Also the slow tests, the Minecraft tests and the package"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  # A quick run does not stop the full run. Main gets one group per run: each merge gets a complete run, so a red
  # main shows (#2145). A group keeps only its newest waiting run, so one group on main also dropped runs.
  group: ci-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}-${{ github.event_name == 'schedule' || inputs.full == true }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}   # a new push to a PR branch stops the run of the old head

jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2     # a PR checks out its merge commit: HEAD^1 is the base
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      # Not a job `if` or `paths-ignore`: Automerge waits for a `quick` check with conclusion success.
      - name: Select the tests
        id: select
        if: github.event_name == 'pull_request'
        run: echo "tests=$(python3 tools/ci_select.py HEAD^1)" >> "$GITHUB_OUTPUT"
      - name: Lint
        if: steps.select.outputs.tests == ''
        run: ruff check .
      # A change of data files only adds no test (owner, 2026-10-29, #4242): a run with an older ship_pr.py can push one.
      - name: Data-only change adds no test
        if: github.event_name == 'pull_request'
        run: |
          python3 -c "import sys, subprocess; sys.path.insert(0, 'framework/tools'); import ship_pr; c = subprocess.run(['git', 'diff', '--name-only', 'HEAD^1...HEAD'], capture_output=True, text=True).stdout.split(); bad = ship_pr.data_only_tests(c); sys.exit('a change of data files only must not add or change tests: ' + ' '.join(bad) + ' (docs/extend.md)') if bad else None"
      - name: Fast tests
        run: pytest -n auto ${{ steps.select.outputs.tests }}   # all cores (#2415)
      # Two green PRs can merge into a main whose plugin does not compile (#2418): compile it when the change (a PR
      # against its base, a merge on main) touches game/plugin, as game/run.py builds it (#2437).
      - name: Plugin changed
        id: plugin
        run: git diff --quiet HEAD^1 -- game/plugin || echo "changed=1" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        if: steps.plugin.outputs.changed
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/cache@v4
        if: steps.plugin.outputs.changed
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: plugin-${{ hashFiles('game/plugin/*.kts', 'game/plugin/gradle/wrapper/*') }}
          restore-keys: plugin-
      - name: Compile the Paper plugin
        if: steps.plugin.outputs.changed
        working-directory: game/plugin
        run: ./gradlew --no-daemon -q jar

  # A CI run that GITHUB_TOKEN started (Unconflict) gives no workflow_run event, and GitHub drops the cron sweep of
  # Automerge: start the sweep after a green quick job, so that the PR merges (#734). A dispatch of GITHUB_TOKEN starts
  # a workflow. A job after `quick`: the sweep needs its check run completed.
  sweep:
    needs: quick
    if: github.event_name == 'workflow_dispatch' && (startsWith(github.ref_name, 'agent/') || startsWith(github.ref_name, 'claude/') || startsWith(github.ref_name, 'ccr-'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write         # gh workflow run
    steps:
      - name: Start the Automerge sweep
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run automerge.yml --ref main -R "$GITHUB_REPOSITORY"

  # The PRs whose CI failed while main was red wait for Unconflict (#3685): start it at once when main is green again.
  recover:
    needs: quick
    if: github.ref == 'refs/heads/main' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write         # gh workflow run
    steps:
      - name: Start Unconflict after a red main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&status=completed&per_page=20" \
                 --jq '[.workflow_runs[] | select(.event != "schedule" and (.conclusion == "success" or .conclusion == "failure"))][0].conclusion')
          echo "the run on main before this one: $last"
          [ "$last" != failure ] || gh workflow run unconflict.yml --ref main -R "$GITHUB_REPOSITORY"

  # The full suite: two parallel jobs, so that a red slow test does not stop the Minecraft tests.
  slow:
    if: github.event_name == 'schedule' || inputs.full == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Slow tests
        run: pytest -m slow
      - name: Package
        run: pip install . && cd /tmp && aoe2mc --help

  mc:
    if: github.event_name == 'schedule' || inputs.full == true
    runs-on: ubuntu-latest
    timeout-minutes: 60     # per shard: the whole `-m mc` took more than 60 minutes in one job (#1677, #1710)
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"         # Minecraft 26.3 needs Java 25
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/aoe2mc
            ~/.gradle/caches
            ~/.gradle/wrapper
          # mc_check.CACHE and its neighbours: the server jar, the Paper jar (game/run.py), the plugin jar
          key: mc-${{ hashFiles('tools/mc_check.py', 'tools/mc_shot.py', 'game/run.py', 'game/plugin/**') }}
          restore-keys: mc-
      - name: Packages for the client screenshots (tools/mc_shot.py)
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb imagemagick mesa-vulkan-drivers xdotool   # xdotool: mc_shot.Client
      - name: Minecraft server and client checks (the test files of this shard)
        env:
          PYTHONPATH: game:tools:.     # some test files import a game/ module by its bare name: alone they need it
        run: pytest -m mc $(grep -l "mark\.mc\b" tests/test_*.py | sort | awk 'NR % 6 == ${{ matrix.shard }}')

  report:
    needs: [quick, slow, mc]
    # A timeout gives `cancelled`, not `failure` (#1677). Only in the night run: a new push cancels a quick run.
    if: >-
      always() && github.ref == 'refs/heads/main' && (contains(needs.*.result, 'failure')
      || (github.event_name == 'schedule' && contains(needs.*.result, 'cancelled')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Open a P0 ticket when main is red
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Fix main: CI is red"
          n=$(gh api "repos/$GITHUB_REPOSITORY/issues?state=open&labels=P0&per_page=50" --jq ".[] | select(.title == \"$title\") | .number" | head -1)
          printf 'CI on main failed: %s\nRead the failed step (`mcp__github__get_job_logs`), run it locally, fix it.\n' "$URL" > body.md
          if [ -n "$n" ]; then gh api "repos/$GITHUB_REPOSITORY/issues/$n/comments" -F body=@body.md >/dev/null
          else
            # A late red run of an older commit opens no ticket when a newer commit on main is green (#4284).
            # A failed read gives no "ahead": the ticket opens as before.
            green=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].head_sha' || true)
            if [ -n "$green" ] && [ "$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...$green" --jq .status || true)" = ahead ]; then
              echo "main is green at $green: no new ticket"; exit 0; fi
            gh api "repos/$GITHUB_REPOSITORY/issues" -f title="$title" -F body=@body.md -f "labels[]=P0" -f "labels[]=bug" -f "labels[]=size:S" >/dev/null; fi
