name: CI

# On each PR, on main and once a night. The repository is public, so the minutes are free (#370).
# The Automerge workflow merges a green agent PR. A red run on main opens a P0 ticket, so that the runs fix main first.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:    # Automerge starts CI on main after its merge (#232), Unconflict on a branch (#280)

permissions:
  contents: read
  issues: write

concurrency:
  group: ci-${{ github.ref }}       # a new push stops the run of the old head
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Fast tests
        run: pytest
      - name: Slow tests
        run: pytest -m slow
      - name: Package
        run: pip install . && cd /tmp && aoe2mc --help

  # Parallel to `test`: the Minecraft checks take about 5 minutes. A PR runs them only when it changes a file that
  # they use. Main, the night run and a start by hand always run them.
  mc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2        # a PR: the merge commit and its first parent, the base
      - name: Does the change need the Minecraft checks?
        id: need
        env:
          EVENT: ${{ github.event_name }}
          FILES: '^(aoe2mc|buildings|units|scx)\.py$|^(game|datapacks)/|^tools/(mc_|mcdata/|measure_gather|tick_cost|scenarios)|^tests/(conftest\.py|test_(mc_|paper|plugin|game|gather|build_|measure_gather|tick_cost))|^(pyproject\.toml|requirements.*\.txt|\.github/workflows/ci\.yml)$'
        run: |
          if [ "$EVENT" != pull_request ]; then echo "mc=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          git diff --name-only HEAD^1 HEAD | tee files.txt
          if grep -qE "$FILES" files.txt; then echo "mc=true"; else echo "mc=false"; fi | tee -a "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.need.outputs.mc == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - if: steps.need.outputs.mc == 'true'
        run: pip install -r requirements-dev.txt
      - uses: actions/setup-java@v4
        if: steps.need.outputs.mc == 'true'
        with:
          distribution: temurin
          java-version: "25"         # Minecraft 26.3 needs Java 25
      - uses: actions/cache@v4
        if: steps.need.outputs.mc == 'true'
        with:
          path: |
            ~/.cache/aoe2mc
            ~/.gradle/caches
            ~/.gradle/wrapper
          # mc_check.CACHE and its neighbours: the server jar, the Paper jar (game/run.py), the plugin jar
          key: mc-${{ hashFiles('tools/mc_check.py', 'tools/mc_shot.py', 'game/run.py', 'game/plugin/**') }}
          restore-keys: mc-
      - name: Packages for the client screenshots (tools/mc_shot.py)
        if: steps.need.outputs.mc == 'true'
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb imagemagick mesa-vulkan-drivers
      - name: Minecraft server and client checks
        if: steps.need.outputs.mc == 'true'
        run: pytest -m mc

  report:
    needs: [test, mc]
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Open a P0 ticket when main is red
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Fix main: CI is red"
          n=$(gh api "repos/$GITHUB_REPOSITORY/issues?state=open&labels=P0&per_page=50" --jq ".[] | select(.title == \"$title\") | .number" | head -1)
          printf 'CI on main failed: %s\nRead the failed step (`mcp__github__get_job_logs`), run it locally, fix it.\n' "$URL" > body.md
          if [ -n "$n" ]; then gh api "repos/$GITHUB_REPOSITORY/issues/$n/comments" -F body=@body.md >/dev/null
          else gh api "repos/$GITHUB_REPOSITORY/issues" -f title="$title" -F body=@body.md -f "labels[]=P0" -f "labels[]=bug" -f "labels[]=size:S" >/dev/null; fi
