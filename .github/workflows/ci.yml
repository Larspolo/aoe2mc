name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Fast tests
        run: pytest
      - name: Slow tests
        run: pytest -m slow
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"         # Minecraft 26.3 needs Java 25
      - uses: actions/cache@v4
        with:
          path: ~/.cache/aoe2mc/mc       # mc_check.CACHE
          key: mc-${{ hashFiles('tools/mc_check.py', 'tools/mc_shot.py') }}
      - name: Packages for the client screenshots (tools/mc_shot.py)
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb imagemagick mesa-vulkan-drivers
      - name: Minecraft server and client checks
        run: pytest -m mc
      - name: Package
        run: pip install . && cd /tmp && aoe2mc --help
