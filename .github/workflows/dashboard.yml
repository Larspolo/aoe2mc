name: Dashboard

# Writes the dashboard in the body of the status issue (#1) from the labels, comments and PRs.
# Not on "edited": the script edits the status issue.
on:
  schedule:
    - cron: "23 */6 * * *"   # each run also writes it with `python3 tools/dashboard.py` (Actions minutes, see ci.yml)
  workflow_dispatch:

permissions:
  contents: read     # checkout needs it (the repository is private)
  issues: write
  pull-requests: read   # the pulls API (open PRs, merged PRs) gives 403 without it

concurrency:
  group: dashboard
  cancel-in-progress: true

jobs:
  dashboard:
    if: github.event_name != 'schedule' || vars.PAUSE_SCHEDULES != 'true'   # the variable pauses the schedules (Actions minutes)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Update the status issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/dashboard.py
