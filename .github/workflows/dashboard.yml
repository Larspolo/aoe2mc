name: Dashboard

# Writes the dashboard in the body of the status issue (#1) from the labels, comments and PRs.
# Not on "edited": the script edits the status issue.
on:
  issues:
    types: [opened, closed, reopened, labeled, unlabeled]
  pull_request:
    types: [closed]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read     # checkout needs it (the repository is private)
  issues: write

concurrency:
  group: dashboard
  cancel-in-progress: true

jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Update the status issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/dashboard.py
