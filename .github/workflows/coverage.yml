name: Coverage

# Updates docs/coverage.md and lowers MAX in tests/test_coverage.py on main (#233).
# PRs do not change these files, so parallel PRs get no merge conflicts in them.
# A push with GITHUB_TOKEN starts no other workflow, so this commit does not start CI again.
# A merge by a workflow (GITHUB_TOKEN) starts no push workflow: start this one with `gh workflow run coverage.yml`.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write    # commit to main

concurrency:
  group: coverage
  cancel-in-progress: false

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - name: Write the report and lower the maximums
        run: python3 tools/coverage.py --ratchet
      - name: Commit the changes to main
        run: |
          if git diff --quiet -- docs/coverage.md tests/test_coverage.py; then
            echo "no change"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Update the coverage report and its maximums" -- docs/coverage.md tests/test_coverage.py
          for i in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull -q --rebase origin main              # main moved: the next push of the CI starts this again
          done
          exit 1
