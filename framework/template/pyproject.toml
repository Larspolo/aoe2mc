[tool.ruff]
line-length = 130

[tool.ruff.lint]
select = ["F"]                  # the copied tools pass these rules; add more rules for the project code

[tool.pytest.ini_options]
testpaths = ["tests", "framework/tests"]
addopts = "--import-mode=importlib"   # a project test may have the name of a framework test (#5910)
